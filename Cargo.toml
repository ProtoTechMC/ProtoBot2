[package]
name = "protobot"
version = "0.1.0"
edition = "2021"

[dependencies]
arpabet = "2.0.0"
async-trait = "0.1"
async-tungstenite = { version = "0.35", features = ["tokio-runtime", "tokio-native-tls"] }
chrono = { version = "0.4.45", features = ["serde"] }
ctrlc = "3.5"
dashmap = "6.1"
flexi_logger = { version = "0.31", default-features = false, features = ["compress"] }
futures = "0.3"
git-version = "0.3"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = "0.1"
linkify = "0.11"
nom = "8.0"
pterodactyl_api = { version = "0.3", features = ["websocket"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
twilight-cache-inmemory = "0.17"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder", "link"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53", features = ["fs", "io-std", "macros", "rt-multi-thread", "time"] }
urlencoding = "2.1"
uuid = { version = "1.28", features = ["serde"] }
